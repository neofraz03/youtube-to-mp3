services:
  webserver:
    #build: .
    image: neofraz03/youtube-to-mp3
    platform: linux/amd64
    container_name: youtube_to_mp3_converter
    ports:
      - "8080:8080"
    volumes:
      - ./downloads:/tmp/downloads
    environment:
      - YOUTUBE_API_KEY=YOUR_API_KEY_HERE
    restart: always